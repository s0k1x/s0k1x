name: Validate Profile

on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/validate-profile.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_readme.py
      - run: python -m py_compile scripts/*.py
