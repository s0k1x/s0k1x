name: Update Cyberpunk Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    paths:
      - "scripts/update_readme.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate README
        run: python scripts/validate_readme.py
      - name: Update repositories and status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py
      - name: Validate generated README
        run: python scripts/validate_readme.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh cyberpunk profile"
            git push
          else
            echo "No README changes."
          fi
